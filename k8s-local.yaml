# Traffic flow:
#   http://platform.local  ->  ingress-nginx controller (localhost:80)
#                          ->  Service platform-eng-service :80
#                          ->  Pod platform-eng-app :8121
# Storage: PVC lab4-data mounted at /app/data (SQLite DB + uploaded PDF specs)
apiVersion: v1
kind: Secret
metadata:
  name: platform-local-secrets
  namespace: default
type: Opaque
stringData:
  connection_string: "sqlite:////app/data/app_platform.db"
  jwt_secret: "lab4-platform-jwt-secret-demo-only-32+chars"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab4-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # no storageClassName: uses the cluster default (Docker Desktop = "hostpath")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-eng-app
  namespace: default
  labels:
    app: platform-eng-app
spec:
  # Keep 1 while the DB is SQLite on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate   # old pod releases the volume before the new one starts
  selector:
    matchLabels:
      app: platform-eng-app
  template:
    metadata:
      labels:
        app: platform-eng-app
    spec:
      containers:
      - name: platform-container
        image: lab4-fastapi:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8121
        env:
        - name: PORT
          value: "8121"
        - name: DATA_DIR
          value: /app/data
        - name: MAX_UPLOAD_MB
          value: "20"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-local-secrets
              key: connection_string
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-local-secrets
              key: jwt_secret
        - name: KNOWLEDGE_DIR             # runbooks/postmortems/blueprints baked into the image
          value: /app/knowledge
        - name: OLLAMA_BASE_URL           # embeddings from Ollama on your Windows host
          value: http://host.docker.internal:11434/v1
        envFrom:                          # optional: EMBEDDING_PROVIDER/MODEL, OPENAI_API_KEY from .env
        - secretRef:
            name: lab4-ai-env
            optional: true
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          limits:
            cpu: "500m"
            memory: 256Mi
          requests:
            cpu: "100m"
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8121
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8121
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lab4-data
---
apiVersion: v1
kind: Service
metadata:
  name: platform-eng-service
  namespace: default
spec:
  selector:
    app: platform-eng-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8121
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-eng-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # ingress-nginx rejects bodies over 1 MB by default (HTTP 413); allow PDF uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
  - host: platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: platform-eng-service
            port:
              number: 80
