# Lab 4 on plain Docker (no Kubernetes)
#
#   docker compose up -d --build
#
#   Product API   http://localhost:8121   (Swagger: /docs)
#   MCP server    http://localhost:8200/mcp
#   AI Assistant  http://localhost:8300
#
# Containers talk to each other by service name (api, mcp) on the compose network.
# Ports are published on 127.0.0.1 only, so they are not reachable from other machines.

name: lab4

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab4-fastapi:v2
    environment:
      PORT: "8121"
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/app_platform.db
      JWT_SECRET: lab4-platform-secret-key
      MAX_UPLOAD_MB: "20"
    volumes:
      - lab4-data:/app/data          # SQLite DB + uploaded PDFs survive restarts
    ports:
      - "127.0.0.1:8121:8121"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8121/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: lab4-ai:v1
    command: ["python", "-m", "mcp_server.server", "--transport", "streamable-http",
              "--host", "0.0.0.0", "--port", "8200"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8121            # container-to-container
      PUBLIC_API_URL: http://localhost:8121    # what your browser opens
      MCP_ALLOWED_HOSTS: localhost,localhost:*,127.0.0.1,127.0.0.1:*,mcp,mcp:*
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  assistant:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: lab4-ai:v1
    command: ["uvicorn", "assistant.app:app", "--host", "0.0.0.0", "--port", "8300"]
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: streamable_http           # set to stdio to run the MCP server inside this container
      MCP_URL: http://mcp:8200/mcp
      API_BASE_URL: http://api:8121            # used only in stdio mode
      PUBLIC_API_URL: http://localhost:8121
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1   # Ollama on your Windows PC
    extra_hosts:
      - "host.docker.internal:host-gateway"    # also works on Linux Docker
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  lab4-data:
